[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-se"
version = "1.0.0"
description = "Intention-Based Speech Enhancement for Hearing Aids Using NLP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aron Burrell" }]
keywords = [
    "speech-enhancement",
    "hearing-aids",
    "nlp",
    "digital-signal-processing",
    "imcra",
    "wiener-filter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
nlp = [
    "sentence-transformers>=2.2",
    "xgboost>=2.0",
]
realtime = [
    "sounddevice>=0.4",
    "soundfile>=0.12",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
all = [
    "intent-se[nlp,realtime,dev]",
]

[project.scripts]
intent-se-train = "intent_se.cli.train_nlp:main"
intent-se-run = "intent_se.cli.run_realtime:main"
intent-se-demo = "intent_se.cli.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.coverage.run]
source = ["intent_se"]
branch = true
