[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-se"
version = "1.0.0"
description = "Intention-Based Speech Enhancement for Hearing Aids Using NLP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aron Burrell" }]
keywords = [
    "speech-enhancement",
    "hearing-aids",
    "nlp",
    "digital-signal-processing",
    "imcra",
    "wiener-filter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
nlp = [
    "sentence-transformers>=2.2",
    "xgboost>=2.0",
]
realtime = [
    "sounddevice>=0.4",
    "soundfile>=0.12",
]
all = [
    "intent-se[nlp,realtime]",
]

[project.scripts]
intent-se-train = "intent_se.cli.train_nlp:main"
intent-se-run = "intent_se.cli.run_realtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
